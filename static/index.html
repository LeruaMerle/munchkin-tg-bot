<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Манчкин Луна</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f7f3ee;
      --card-bg: #ffffff;
      --primary: #f08a5d;
      --text-main: #2d3436;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .header {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .status-text {
      font-size: 14px;
      color: #636e72;
      height: 22px;
      margin-bottom: 12px;
      font-weight: 500;
      text-align: center;
    }
    /* Контейнер сцены */
    .cat-stage {
      position: relative;
      width: 250px;
      height: 250px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .cat-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Таймер-плашка */
    .timer-overlay {
      position: absolute;
      bottom: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      backdrop-filter: blur(4px);
    }
    .stats-card {
      width: 100%;
      max-width: 320px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      margin: 8px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .stat-label { width: 90px; }
    .bar-bg {
      flex: 1;
      height: 10px;
      background: #edf2f7;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 10px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s ease;
    }
    .hunger-fill { background: #ff7675; }
    .energy-fill { background: #fdcb6e; }
    .happy-fill { background: #00b894; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      border: none;
      background: var(--card-bg);
      padding: 14px 10px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
      background: #f1f2f6;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn span { font-size: 24px; }
  </style>
</head>
<body>

  <div class="header">Манчкин Луна 🐾</div>
  <div class="status-text" id="status-text">Луна с радостью ждет вас!</div>

  <div class="cat-stage">
    <img src="/static/luna.jpg" alt="Луна" class="cat-media" id="cat-img">
    <video src="" class="cat-media" id="cat-video" style="display: none;" autoplay loop muted playsinline></video>
    <div class="timer-overlay" id="timer-box">⏳ Осталось: <span id="timer-val">01:00</span></div>
  </div>

  <div class="stats-card">
    <div class="stat-row">
      <span class="stat-label">🥣 Сытость</span>
      <div class="bar-bg"><div class="bar-fill hunger-fill" id="bar-hunger"></div></div>
      <span id="txt-hunger">80%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">⚡ Энергия</span>
      <div class="bar-bg"><div class="bar-fill energy-fill" id="bar-energy"></div></div>
      <span id="txt-energy">80%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💖 Счастье</span>
      <div class="bar-bg"><div class="bar-fill happy-fill" id="bar-happy"></div></div>
      <span id="txt-happy">80%</span>
    </div>
  </div>

  <div class="actions-grid">
    <button class="btn" id="btn-feed" onclick="triggerAction('feed')">
      <span>🍲</span>Покормить (1 мин)
    </button>
    <button class="btn" id="btn-play" onclick="triggerAction('play')">
      <span>🐭</span>Поиграть (1 мин)
    </button>
    <button class="btn" id="btn-sleep" onclick="triggerAction('sleep')">
      <span>💤</span>Уложить спать (1 мин)
    </button>
    <button class="btn" id="btn-pet" onclick="petCat()">
      <span>😻</span>Погладить
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const userId = tg?.initDataUnsafe?.user?.id || 12345;
    let state = { hunger: 80, energy: 80, happiness: 80, busy_until: 0, current_action: '' };
    let countdownInterval = null;

    const catImg = document.getElementById('cat-img');
    const catVideo = document.getElementById('cat-video');
    const timerBox = document.getElementById('timer-box');
    const timerVal = document.getElementById('timer-val');
    const statusText = document.getElementById('status-text');

    const videoMap = {
      'feed': '/static/feed.mp4',
      'play': '/static/play.mp4',
      'sleep': '/static/sleep.mp4'
    };

    const actionTexts = {
      'feed': 'Луна аппетитно кушает полезный корм... 🍲',
      'play': 'Луна увлеченно играет с мышонком! 🐭',
      'sleep': 'Луна сладко дремлет на подушке... 💤'
    };

    function renderBars() {
      document.getElementById('bar-hunger').style.width = state.hunger + '%';
      document.getElementById('txt-hunger').textContent = state.hunger + '%';

      document.getElementById('bar-energy').style.width = state.energy + '%';
      document.getElementById('txt-energy').textContent = state.energy + '%';

      document.getElementById('bar-happy').style.width = state.happiness + '%';
      document.getElementById('txt-happy').textContent = state.happiness + '%';
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('.btn').forEach(btn => btn.disabled = disabled);
    }

    function checkBusyState() {
      const now = Math.floor(Date.now() / 1000);
      const remaining = state.busy_until - now;

      if (remaining > 0 && state.current_action) {
        setButtonsDisabled(true);
        timerBox.style.display = 'block';
        catImg.style.display = 'none';
        catVideo.style.display = 'block';

        if (!catVideo.src.endsWith(videoMap[state.current_action])) {
          catVideo.src = videoMap[state.current_action];
          catVideo.play();
        }

        statusText.textContent = actionTexts[state.current_action] || 'Луна занята...';

        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
          const left = state.busy_until - Math.floor(Date.now() / 1000);
          if (left <= 0) {
            clearInterval(countdownInterval);
            finishCurrentAction();
          } else {
            const m = String(Math.floor(left / 60)).padStart(2, '0');
            const s = String(left % 60).padStart(2, '0');
            timerVal.textContent = `${m}:${s}`;
          }
        }, 1000);
      } else {
        resetToIdle();
      }
    }

    function resetToIdle() {
      clearInterval(countdownInterval);
      setButtonsDisabled(false);
      timerBox.style.display = 'none';
      catVideo.pause();
      catVideo.style.display = 'none';
      catImg.style.display = 'block';
      statusText.textContent = 'Луна довольно мурлычет рядом с вами 🐾';
    }

    async function triggerAction(action) {
      try {
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        const res = await fetch(`/api/pet/start?user_id=${userId}&action=${action}`, { method: 'POST' });
        state = await res.json();
        renderBars();
        checkBusyState();
      } catch (e) {
        console.error(e);
      }
    }

    async function finishCurrentAction() {
      try {
        const res = await fetch(`/api/pet/finish?user_id=${userId}`, { method: 'POST' });
        state = await res.json();
        renderBars();
        resetToIdle();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } catch (e) {
        console.error(e);
      }
    }

    async function petCat() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      statusText.textContent = 'Вы погладили Луну, она довольно урчит! ❤️';
      try {
        const res = await fetch(`/api/pet/action?user_id=${userId}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ happiness: 5 })
        });
        state = await res.json();
        renderBars();
      } catch (e) {}
    }

    async function fetchPet() {
      try {
        const res = await fetch(`/api/pet?user_id=${userId}`);
        state = await res.json();
        renderBars();
        checkBusyState();
      } catch (e) {
        renderBars();
      }
    }

    fetchPet();
  </script>
</body>
</html>
</html>
