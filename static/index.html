<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Манчкин Луна</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f7f3ee;
      --card-bg: #ffffff;
      --primary: #f08a5d;
      --text-main: #2d3436;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .status-text {
      font-size: 14px;
      color: #636e72;
      height: 20px;
      margin-bottom: 12px;
      font-weight: 500;
    }
    /* Сцена с котиком */
    .cat-stage {
      position: relative;
      width: 220px;
      height: 220px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .cat-avatar {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    /* Облачко эмоции */
    .emotion-bubble {
      position: absolute;
      top: 5px;
      right: 15px;
      font-size: 32px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .emotion-bubble.show {
      opacity: 1;
      transform: scale(1.2);
    }
    /* CSS Анимации реакций */
    .bounce {
      animation: bounceAnim 0.6s ease;
    }
    .purr {
      animation: purrAnim 0.8s ease infinite alternate;
    }
    .sleepy {
      opacity: 0.7;
      filter: brightness(0.85);
      transform: scale(0.96);
    }
    .eating {
      animation: eatAnim 0.5s ease 2;
    }
    @keyframes bounceAnim {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px) scale(1.05); }
    }
    @keyframes purrAnim {
      0% { transform: scale(1); }
      100% { transform: scale(1.04) rotate(1deg); }
    }
    @keyframes eatAnim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.95, 1.05); }
    }

    /* Индикаторы параметров */
    .stats-card {
      width: 100%;
      max-width: 320px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      margin: 8px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .stat-label {
      width: 90px;
    }
    .bar-bg {
      flex: 1;
      height: 10px;
      background: #edf2f7;
      border-radius: 5px;
      overflow: hidden;
      margin: 0 10px;
    }
    .bar-fill {
      height: 100%;
      width: 80%;
      border-radius: 5px;
      transition: width 0.4s ease;
    }
    .hunger-fill { background: #ff7675; }
    .energy-fill { background: #fdcb6e; }
    .happy-fill { background: #00b894; }

    /* Кнопки действий */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      border: none;
      background: var(--card-bg);
      padding: 14px 10px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
      background: #f1f2f6;
    }
    .btn span { font-size: 22px; }
  </style>
</head>
<body>

  <div class="header">Манчкин Луна 🐾</div>
  <div class="status-text" id="status-text">Мурчит и смотрит на вас!</div>

  <!-- Котик и плавающая эмоция -->
  <div class="cat-stage" onclick="petCat()">
    <img src="/static/luna.jpg" alt="Луна" class="cat-avatar" id="cat-avatar">
    <div class="emotion-bubble" id="bubble">❤️</div>
  </div>

  <!-- Шкалы характеристик -->
  <div class="stats-card">
    <div class="stat-row">
      <span class="stat-label">🥣 Сытость</span>
      <div class="bar-bg"><div class="bar-fill hunger-fill" id="bar-hunger"></div></div>
      <span id="txt-hunger">80%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">⚡ Энергия</span>
      <div class="bar-bg"><div class="bar-fill energy-fill" id="bar-energy"></div></div>
      <span id="txt-energy">80%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💖 Счастье</span>
      <div class="bar-bg"><div class="bar-fill happy-fill" id="bar-happy"></div></div>
      <span id="txt-happy">80%</span>
    </div>
  </div>

  <!-- Кнопки ухода -->
  <div class="actions-grid">
    <button class="btn" onclick="performAction('feed')">
      <span>🍲</span>Покормить
    </button>
    <button class="btn" onclick="performAction('play')">
      <span>🪶</span>Удочка
    </button>
    <button class="btn" onclick="performAction('brush')">
      <span>🪮</span>Расчесать
    </button>
    <button class="btn" onclick="performAction('sleep')">
      <span>💤</span>Уложить спать
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const userId = tg?.initDataUnsafe?.user?.id || 12345; // тестовый ID, если запуск в браузере

    let state = { hunger: 80, energy: 80, happiness: 80 };
    const avatar = document.getElementById('cat-avatar');
    const bubble = document.getElementById('bubble');
    const statusText = document.getElementById('status-text');

    function showEmotion(emoji, animClass, text, duration = 1200) {
      bubble.textContent = emoji;
      bubble.classList.add('show');
      avatar.className = 'cat-avatar ' + animClass;
      statusText.textContent = text;

      // Тактильный отклик смартфона через Telegram WebApp
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      setTimeout(() => {
        bubble.classList.remove('show');
        avatar.className = 'cat-avatar';
        statusText.textContent = "Луна довольно наблюдает за вами 🐾";
      }, duration);
    }

    function renderBars() {
      document.getElementById('bar-hunger').style.width = state.hunger + '%';
      document.getElementById('txt-hunger').textContent = state.hunger + '%';

      document.getElementById('bar-energy').style.width = state.energy + '%';
      document.getElementById('txt-energy').textContent = state.energy + '%';

      document.getElementById('bar-happy').style.width = state.happiness + '%';
      document.getElementById('txt-happy').textContent = state.happiness + '%';
    }

    // Клик по котику — погладить
    async function petCat() {
      showEmotion('😻', 'purr', 'Луна ласково мурлычет от поглаживаний!');
      await sendUpdate({ happiness: 5 });
    }

    // Обработка действий
    async function performAction(action) {
      if (action === 'feed') {
        showEmotion('😋', 'eating', 'Хрустит сбалансированным кормом!');
        await sendUpdate({ hunger: 25, happiness: 5 });
      } else if (action === 'play') {
        if (state.energy < 15) {
          showEmotion('🥱', '', 'Луна слишком устала для активных игр!');
          return;
        }
        showEmotion('🐾', 'bounce', 'Луна ловит перышко на коротких лапках!');
        await sendUpdate({ happiness: 25, energy: -15, hunger: -10 });
      } else if (action === 'brush') {
        showEmotion('✨', 'purr', 'Вычесываем шерстку, чтобы не было колтунов!');
        await sendUpdate({ happiness: 15, energy: -5 });
      } else if (action === 'sleep') {
        showEmotion('💤', 'sleepy', 'Луна свернулась в клубочек и сладко спит...', 2000);
        await sendUpdate({ energy: 35, hunger: -5 });
      }
    }

    async function sendUpdate(delta) {
      try {
        const res = await fetch(`/api/pet/action?user_id=${userId}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(delta)
        });
        const data = await res.json();
        state = data;
        renderBars();
      } catch (e) {
        console.error(e);
      }
    }

    // Первичная загрузка статуса
    async function fetchPet() {
      try {
        const res = await fetch(`/api/pet?user_id=${userId}`);
        state = await res.json();
        renderBars();
      } catch (e) {
        renderBars();
      }
    }

    fetchPet();
  </script>
</body>
</html>
